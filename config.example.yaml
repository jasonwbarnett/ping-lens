# ping-lens example configuration. Copy to /etc/ping-lens/config.yaml and edit.

# Unique name for this probe source. Used as a primary key dimension.
source: quantum_pi

# auto = single_isp when there is one source, multi_isp when there are >1.
mode: auto

isp:
  name: Quantum Fiber
  plan: 1 Gig
  connection_type: fiber
  location_label: Highlands Ranch home

database:
  # Either set url directly, or set url_env to the name of an environment
  # variable holding the Neon connection string.
  url_env: PING_LENS_DATABASE_URL

probe:
  interval_seconds: 5
  timeout_seconds: 3
  # privileged=false uses unprivileged UDP echo. The running user's primary
  # group must be inside net.ipv4.ping_group_range — on most distros this is
  # already wide open (0 2147483647). Set privileged=true only if your
  # kernel/sysctl forbids it and you can install with CAP_NET_RAW (see the
  # ping-lens-raw.service unit in deploy/).
  privileged: false

flush:
  # How often the spool is rotated and shipped to Postgres.
  interval_minutes: 30
  spool_dir: /var/lib/ping-lens/spool
  # How often the in-memory spool buffer is flushed to disk. Bounds crash
  # loss to this many seconds and lets `tail -F` show progress without
  # waiting for the buffer to fill or the next interval_minutes tick.
  # Send SIGUSR1 to the process for an immediate spool rotate + DB ship.
  spool_flush_seconds: 60

rollup:
  window_minutes: 30

retention:
  raw_days: 14
  rollup_days: 365
  spool_hours: 24

network:
  # Local gateway IP. Probed each tick to disambiguate ISP outages from LAN
  # outages (gateway down + everything down = LAN issue, gateway up +
  # everything down = ISP issue).
  #   "auto"    detect default route from /proc/net/route (Linux)
  #   <ip>      use this address explicitly
  #   ""        omit
  local_gateway: auto
  # First router past your gateway, typically the ISP's edge. Probed each
  # tick so you can tell the difference between "ISP is dropping packets"
  # (first hop loses) and "destination is dropping" (first hop fine).
  #   "auto"    derive via `traceroute -m 3 1.1.1.1`, take hop 2
  #   <ip>      use this address explicitly
  #   ""        omit
  isp_first_hop: auto

outage:
  # Number of consecutive failed ticks before a target counts as "failing"
  # for outage classification. Single dropped packets still appear in the
  # rollup loss%, but do not open an outage event. Default 2 — at the
  # default 5s probe interval, that's 10s of continuous failure.
  min_consecutive_failures: 2

http:
  # Bind localhost-only by default. Front this with a reverse proxy + auth
  # if you want LAN/Internet exposure.
  listen: 127.0.0.1:8080

targets:
  cloudflare_dns:
    address: 1.1.1.1
    group: dns
  google_dns:
    address: 8.8.8.8
    group: dns
  quad9_dns:
    address: 9.9.9.9
    group: dns
  github:
    address: github.com
    group: work_tools
  google:
    address: google.com
    group: big_tech
  cloudflare:
    address: cloudflare.com
    group: big_tech
  wikipedia:
    address: wikipedia.org
    group: reference

# Optional tuning. Leave commented to use the built-in defaults.
# thresholds:
#   loss_pct:
#     excellent: 0.01
#     good:      0.05
#     fair:      0.25
#     poor:      1.00
#   p95_ms:
#     excellent: 25
#     good:      50
#     fair:      100
#     poor:      200
#   p99_ms:
#     excellent: 75
#     good:      150
#     fair:      300
#     poor:      750
